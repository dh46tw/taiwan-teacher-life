<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="start">
  <div class="wrap">
    <div class="stitch"></div>
    <h1 id="logo-tap">TeacherLife<br><em>台灣教師人生模擬器</em></h1>
    <div id="ver-badge" style="position:fixed;top:6px;right:8px;font-size:10px;letter-spacing:1px;color:var(--dim);opacity:.55;font-family:monospace;z-index:50;pointer-events:none"></div>
    <p class="sub">教育實習 → 教甄 → 介聘・職務輪替 → 過勞與退休。每一個決定都算數。</p>
    <div class="field"><label>教師姓名</label><input id="in-name" maxlength="10" placeholder="例如：陳靖雯" value=""></div>
    <div class="field"><label>任教科目</label>
      <div class="seg five" id="seg-subj">
        <button data-v="國文" class="on">國文</button><button data-v="英文">英文</button>
        <button data-v="數學">數學</button><button data-v="理化">理化</button><button data-v="社會">社會</button>
      </div></div>
    <div class="field"><label>任教階段</label>
      <div class="seg two" id="seg-stage">
        <button data-v="國中" class="on">國中</button><button data-v="高中">高中</button>
      </div></div>
    <button class="btn main" style="margin-top:28px" id="btn-start">開始生涯 ▸ 教育實習</button>
    <p class="seedline">世界種子
      <input id="seed-show" maxlength="24" style="width:120px;background:#0e2034;color:#ffc95c;border:1px solid #2b4560;border-radius:6px;padding:2px 6px;font-family:inherit;font-size:12px;text-align:center">
      · <a href="#" id="seed-re" style="color:var(--blue)">換一個</a><br>相同種子＋相同選擇＝相同人生（可直接輸入朋友的種子碼）</p>
  </div>
</div>
<div id="app">
  <header id="board" style="display:none">
    <div id="bd-top"><div id="bd-name"></div><div id="bd-team"></div><button id="btn-restart" title="重新開始">↺</button></div>
    <div id="bd-grid">
      <div class="bd-cell"><b id="bd-age">18</b><span>年齡</span></div>
      <div class="bd-cell"><b id="bd-year">2026</b><span>年份</span></div>
      <div class="bd-cell"><b id="bd-ovr">30</b><span>教學評價</span></div>
      <div class="bd-cell"><b id="bd-sal">0</b><span>生涯薪(萬)</span></div>
    </div>
    <div id="lamps">
      <span class="lamp" id="lp0"><i></i>開學期</span>
      <span class="lamp" id="lp1"><i></i>學期中</span>
      <span class="lamp" id="lp2"><i></i>學期末</span>
    </div>
  </header>
  <main id="log"></main>
  <button id="act-toggle" style="display:none">⌄ 收合選項</button>
  <footer id="act" style="display:none"></footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
